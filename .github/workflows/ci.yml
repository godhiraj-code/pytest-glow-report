name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.8"
            experimental: true

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev,pytest]"
        pip install tox
        
    - name: Run Tests
      # We skip tox for simplicity in this generated workflow and define direct commands, 
      # or use tox if installed.
      run: |
        pytest tests/
      
    - name: Verify Unittest Mode (No Pytest)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        python -m venv venv-unittest
        source venv-unittest/bin/activate
        pip install .
        if pip show pytest; then echo "Pytest should not be installed"; exit 1; fi
        glow-report run -- python -m unittest discover examples/
